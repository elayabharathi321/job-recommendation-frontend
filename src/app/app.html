<div class="page">

  <div class="container">

    <h1>Job Recommendation</h1>

    <!-- User Information -->

    <div class="user-card">

      <h2>User Information</h2>

      <p>
        <strong>User ID:</strong>
        {{ userId }}
      </p>

      <p>
        <strong>User Name:</strong>

        <span *ngIf="userName">
          {{ userName }}
        </span>

        <span *ngIf="!userName">
          -
        </span>
      </p>

    </div>


    <!-- User Skills -->

    <div
      class="skills-card"
      *ngIf="userSkills.length > 0">

      <h2>Your Skills</h2>

      <div class="skills">

        <span
          class="skill"
          *ngFor="let skill of userSkills">

          {{ skill }}

        </span>

      </div>

    </div>


    <!-- Find Button -->

    <button
      class="find-button"
      (click)="findJobs()"
      [disabled]="loading">

      {{ loading ? 'Finding Jobs...' : 'Find Jobs' }}

    </button>


    <!-- Loading -->

    <div
      class="loading"
      *ngIf="loading">

      Loading recommendations...

    </div>


    <!-- Error -->

    <div
      class="error"
      *ngIf="error">

      {{ error }}

    </div>


    <!-- Jobs -->

    <div
      class="jobs-section"
      *ngIf="!loading && jobs.length > 0">

      <h2>Recommended Jobs</h2>

      <div
        class="job-card"
        *ngFor="let job of jobs">

        <h3>
          {{ job.job }}
        </h3>

        <p>
          <strong>Company:</strong>
          {{ job.company }}
        </p>

        <p>
          <strong>Location:</strong>
          {{ job.location }}
        </p>

        <p>
          <strong>Salary:</strong>
          ₹{{ job.salary }}
        </p>

      </div>

    </div>


    <!-- No Jobs -->

    <div
      class="no-jobs"
      *ngIf="!loading && !error && jobs.length === 0 && userName">

      No matching jobs found.

    </div>

  </div>

</div>
