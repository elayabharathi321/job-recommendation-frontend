<div class="page">

  <div class="container">

    <h1>Job Recommendation</h1>


    <!-- SEARCH USER -->

    <div class="search-card">

      <label>
        Enter User ID
      </label>

      <div class="search-box">

        <input
          type="number"
          [(ngModel)]="userId"
          placeholder="Enter User ID"
        />

        <button
          type="button"
          (click)="findJobs()"
          [disabled]="loading">

          {{ loading ? 'Finding Jobs...' : 'Find Jobs' }}

        </button>

      </div>

    </div>


    <!-- LOADING -->

    <div
      class="loading"
      *ngIf="loading">

      Loading recommendations...

    </div>


    <!-- ERROR -->

    <div
      class="error"
      *ngIf="error">

      {{ error }}

    </div>


    <!-- USER INFORMATION -->

    <div
      class="user-card"
      *ngIf="!loading && userName">

      <h2>User Information</h2>

      <div class="user-row">

        <strong>User ID:</strong>

        <span>
          {{ userId }}
        </span>

      </div>

      <div class="user-row">

        <strong>User Name:</strong>

        <span>
          {{ userName }}
        </span>

      </div>

    </div>


    <!-- USER SKILLS -->

    <div
      class="skills-card"
      *ngIf="!loading && userSkills.length > 0">

      <h2>Your Skills</h2>

      <div class="skills">

        <span
          class="skill"
          *ngFor="let skill of userSkills">

          {{ skill }}

        </span>

      </div>

    </div>


    <!-- JOBS -->

    <div
      class="jobs-section"
      *ngIf="!loading && jobs.length > 0">

      <h2>Recommended Jobs</h2>

      <div
        class="job-card"
        *ngFor="let job of jobs">

        <h3>
          {{ job.job }}
        </h3>

        <div class="job-detail">

          <strong>Company:</strong>
          {{ job.company }}

        </div>

        <div class="job-detail">

          <strong>Location:</strong>
          {{ job.location }}

        </div>

        <div class="job-detail">

          <strong>Salary:</strong>
          ₹{{ job.salary }}

        </div>

      </div>

    </div>


    <!-- NO JOBS -->

    <div
      class="no-jobs"
      *ngIf="
        !loading &&
        searched &&
        !error &&
        userName &&
        jobs.length === 0
      ">

      No recommended jobs found.

    </div>

  </div>

</div>
